  <style>
    :root{--bg:#050814;--panel:#0b1022;--panel2:#0f1530;--ink:#e9ecff;--muted:#9aa3c7;--line:#1a2142;--brand:#6366f1;--brand2:#22d3ee;--accent:#ec4899;--ok:#10b981;--warn:#f59e0b;--bad:#ef4444}
    html,body{background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Inter,sans-serif}
    .glow{background:radial-gradient(1200px 600px at 10% -10%, rgba(99,102,241,.25), transparent 60%),radial-gradient(900px 500px at 90% 0%, rgba(34,211,238,.18), transparent 60%),radial-gradient(700px 400px at 50% 100%, rgba(236,72,153,.12), transparent 60%)}
    .card{background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.01)); border:1px solid var(--line); border-radius:16px}
    .chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.03);font-size:12px;color:var(--muted)}
    .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:12px;font-weight:600;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--ink);cursor:pointer;transition:all .15s}
    .btn:hover{background:rgba(255,255,255,.06)}
    .btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand2));border:0;color:white}
    .btn-primary:hover{filter:brightness(1.1)}
    .btn-ghost{background:transparent}
    .tab-active{background:linear-gradient(135deg, rgba(99,102,241,.15), rgba(34,211,238,.1)); border-color:rgba(99,102,241,.4); color:white}
    .grad-text{background:linear-gradient(90deg,#a5b4fc,#67e8f9,#f9a8d4);-webkit-background-clip:text;background-clip:text;color:transparent}
    .scrollbar::-webkit-scrollbar{width:8px;height:8px}
    .scrollbar::-webkit-scrollbar-thumb{background:#1a2142;border-radius:8px}
    .aspect-9-16{aspect-ratio:9/16}.aspect-1-1{aspect-ratio:1/1}.aspect-16-9{aspect-ratio:16/9}
    .ring-brand{box-shadow:0 0 0 1px rgba(99,102,241,.5), 0 10px 40px rgba(99,102,241,.15)}
    a:focus-visible, button:focus-visible, [role=button]:focus-visible{outline:2px solid #22d3ee; outline-offset:2px; border-radius:8px}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @keyframes pulseDot{0%,100%{opacity:.35}50%{opacity:1}}
    .dot{width:8px;height:8px;border-radius:999px;background:var(--ok);animation:pulseDot 1.6s infinite}
    @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
    .shimmer{background:linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.08) 50%, rgba(255,255,255,0) 100%); background-size:200% 100%; animation:shimmer 1.8s infinite}
    @keyframes zsFadeIn{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:scale(1)}}
    .zs-fade-in{animation:zsFadeIn .45s ease-out both}
  </style>
</head>
